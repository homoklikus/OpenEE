; Konfiguracja OpenEE – SZABLON. Wpisz ścieżki do własnych instalacji (pierwsza istniejąca z listy; ~ = katalog domowy).
; Instalacje są wyłącznie czytane. Zmiany z launchera trafiają do konfiguracja/uzytkownik.cfg (nie jest publikowany).
; Zamiast edycji można: ustawić zmienną OPENEE_EE_PATH albo wskazać katalog w launcherze („Zmień…”).

[instalacje]
; czysta instalacja Empire Earth Gold Edition (np. GOG) – katalog zawierający „Empire Earth” i „Empire Earth - The Art of Conquest”
referencyjna=["~/Gry/Empire Earth Gold", "~/GOG Games/Empire Earth Gold", "C:/GOG Games/Empire Earth Gold"]
; opcjonalnie: druga instalacja, np. z polską wersją językową (źródło lokalizacji PL i nakładek)
spolecznosciowa=["~/Gry/Empire Earth Gold Edition PL"]

[zrodlo]
gra="referencyjna"
profil="aoc"

[warstwy]
aktywne=["vanilla", "aoc"]

[lokalizacja]
; niezależny wybór języka tekstów, głosów i kampanii: "en" (oryginał) lub "pl" (wymaga instalacji zrodlo_pl
; i manifestu dane/lokalizacja/pl/manifest.json – narzedzia/przygotuj_dane_lokalne.sh)
jezyk_tekstow="en"
jezyk_glosow="en"
jezyk_kampanii="en"
zrodlo_pl="spolecznosciowa"

[cache]
katalog="cache"

[render]
skala_wysokosci=1.0
